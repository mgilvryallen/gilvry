# Builds the loops from stems/ and publishes the app to GitHub Pages, on every push to main.
# One-time setup: Settings → Pages → Source: GitHub Actions.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install numpy
        run: pip install --quiet numpy
      - name: Build the loops
        run: python3 tools/build.py _site/loops
      - name: Gather the site
        run: cp -r index.html sw.js manifest.webmanifest icons fonts _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
