<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ilvry</title>
    <meta name="description" content="Loops and a drone that layer and wander on their own, steered by a few mysterious sliders.">
    <meta name="theme-color" content="#f7f3e9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ilvry">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <style>
        @font-face {
            font-family: 'Rug Pull';
            src: url('fonts/TAYRugPull.otf') format('opentype');
            font-display: swap;
        }

        @font-face {
            font-family: 'Lumios Typewriter';
            src: url('fonts/LumiosTypewriter-Old.ttf') format('truetype');
            font-display: swap;
        }

        :root {
            --parchment: #f7f3e9;
            --paper: #fffdf7;
            --ink: #2c2416;
            --heading: #4a3f2f;
            --green: #3d5a42;
            --tan: #8b7759;
            --light-tan: #c9bda5;
            --muted: #6b5d4f;
            --rust: #a0522d;
            --ochre: #b07d2a;
            --woad: #3e5f8a;
            --indigo: #34466e;
            --plum: #7b4b6a;
            --teal: #2f6f6b;
            --slate: #586878;
            --berry: #94404f;
            --moss: #6b7a3a;
        }

        [hidden] {
            display: none !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Rebalance lines so text never ends on one lonely word, and headings break evenly */
        p, label, .hint {
            text-wrap: pretty;
        }

        h1, h2 {
            text-wrap: balance;
        }

        body {
            font-family: 'Lumios Typewriter', Georgia, serif;
            font-size: 17px;
            line-height: 1.6;
            color: var(--ink);
            background-color: var(--parchment);
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(139, 119, 89, 0.02) 2px, rgba(139, 119, 89, 0.02) 4px);
            padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
            min-height: 100vh;
        }

        .container {
            max-width: 440px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin: 10px 0 24px;
        }

        header img {
            width: 56px;
            height: 56px;
        }

        h1 {
            font-family: 'Rug Pull', Georgia, serif;
            font-weight: normal;
            font-size: 40px;
            letter-spacing: 1px;
            color: var(--heading);
            line-height: 1.1;
        }

        h2 {
            font-family: 'Rug Pull', Georgia, serif;
            font-weight: normal;
            font-size: 22px;
            color: var(--accent, var(--heading));
            margin-bottom: 12px;
        }

        .card {
            background: var(--paper);
            border: 1px solid var(--light-tan);
            border-top: 4px solid var(--accent, var(--light-tan));
            padding: 20px;
            margin-bottom: 20px;
        }

        a {
            color: var(--green);
        }

        /* ---- Player ---- */

        .player {
            text-align: center;
        }

        .stage {
            position: relative;
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1;
            margin: 0 auto;
        }

        .stage canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 0 1px var(--light-tan), 0 0 0 6px var(--paper), 0 0 0 7.5px var(--ochre);
        }

        .play-btn {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 96px;
            height: 96px;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--rust);
            color: var(--parchment);
            border: none;
            cursor: pointer;
            box-shadow: 0 0 0 4px var(--paper), 0 0 0 5.5px var(--ochre);
            transition: opacity 1.2s, transform 1.2s, background 0.3s;
        }

        .play-btn svg {
            width: 38px;
            height: 38px;
            fill: currentColor;
        }

        .play-btn:hover {
            background: #8a4524;
        }

        .play-btn:disabled {
            background: var(--light-tan);
            cursor: default;
        }

        /* While playing, the button steps back so the picture can be seen; it comes forward on hover */
        .playing .play-btn {
            background: var(--green);
            opacity: 0.22;
            transform: translate(-50%, -50%) scale(0.7);
        }

        .playing .play-btn:hover,
        .playing .play-btn:focus-visible {
            opacity: 0.9;
        }

        .play-label {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 15px;
            color: var(--muted);
            margin-top: 18px;
        }

        .now {
            margin-top: 6px;
            min-height: 1.6em;
            color: var(--tan);
            font-size: 14px;
            transition: opacity 0.8s;
        }

        /* ---- Sliders ---- */

        .slider-row {
            margin-bottom: 18px;
        }

        .slider-row:last-child {
            margin-bottom: 0;
        }

        .slider-name {
            font-family: 'Rug Pull', Georgia, serif;
            font-size: 17px;
            letter-spacing: 0.5px;
            color: var(--row, var(--heading));
        }

        .slider-ends {
            display: flex;
            justify-content: space-between;
            color: var(--tan);
            font-size: 13px;
            margin-top: -2px;
        }

        input[type="range"] {
            width: 100%;
            height: 32px;
            accent-color: var(--row, var(--green));
        }

        .hint {
            color: var(--muted);
            font-size: 14px;
            margin-top: 14px;
        }

        .credit {
            text-align: center;
            margin-top: 24px;
            color: var(--muted);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="icons/icon.svg" alt="">
            <h1>ilvry</h1>
        </header>

        <div class="card player" id="player" style="--accent: var(--rust)">
            <div class="stage">
                <canvas id="canvas" aria-hidden="true"></canvas>
                <button class="play-btn" id="playBtn" onclick="togglePlay()" aria-label="Play" disabled></button>
            </div>
            <div class="play-label" id="playLabel">gathering the loops…</div>
            <div class="now" id="now"></div>
        </div>

        <div class="card" style="--accent: var(--plum)">
            <div class="slider-row" style="--row: var(--rust)">
                <div class="slider-name">Kindling</div>
                <input type="range" id="kindling" min="0" max="1000" oninput="setSetting('kindling', this.value / 1000)" aria-label="Kindling">
                <div class="slider-ends"><span>embers</span><span>bonfire</span></div>
            </div>
            <div class="slider-row" style="--row: var(--indigo)">
                <div class="slider-name">Hour</div>
                <input type="range" id="hour" min="0" max="1000" oninput="setSetting('hour', this.value / 1000)" aria-label="Hour">
                <div class="slider-ends"><span>dusk</span><span>dawn</span></div>
            </div>
            <div class="slider-row" style="--row: var(--moss)">
                <div class="slider-name">Gait</div>
                <input type="range" id="gait" min="0" max="1000" oninput="setSetting('gait', this.value / 1000)" aria-label="Gait">
                <div class="slider-ends"><span>amble</span><span>scurry</span></div>
            </div>
            <div class="slider-row" style="--row: var(--ochre)">
                <div class="slider-name">Hum</div>
                <input type="range" id="hum" min="0" max="1000" oninput="setSetting('hum', this.value / 1000)" aria-label="Hum">
                <div class="slider-ends"><span>hush</span><span>front porch</span></div>
            </div>
        </div>

        <div class="credit">
            Made by <a href="https://mgilvryallen.com" target="_blank">M'Gilvry Allen</a><br><a href="https://github.com/mgilvryallen/ilvry" target="_blank">make your own copy</a>
        </div>
    </div>

    <script>
        const SETTINGS_KEY = 'ilvrySettings';
        const DEFAULTS = { kindling: 0.35, hour: 0.5, gait: null, hum: 0.65 };
        const PHRASE = 4; // bars between the engine's chances to change its mind

        function loadSettings() {
            try {
                return { ...DEFAULTS, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') };
            } catch (e) {
                return { ...DEFAULTS };
            }
        }

        function saveSettings() {
            try {
                localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
            } catch (e) {}
        }

        const settings = loadSettings();

        // ---- Loading ----
        // loops/index.json (made by tools/build.py) lists the stems. Each MP3 holds its loop with a
        // little wrap-around on both sides; cutting out the middle gives an exact, seamless loop.

        let index = null;
        let ctx = null;
        let stems = [];

        // Every loop is fetched up front (small, compressed), but only decoded when it's likely to
        // be wanted soon: a decoded 16-bar loop takes several MB of memory, and phones run out.
        async function loadAll() {
            ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' });
            index = await (await fetch('loops/index.json')).json();
            if (settings.gait === null) settings.gait = gaitFor(index.bpm);
            render();
            let done = 0;
            const queue = [...index.stems];
            const load = async () => {
                while (queue.length) {
                    const meta = queue.shift();
                    try {
                        stems.push(makeStem(meta, await (await fetch('loops/' + meta.file)).arrayBuffer()));
                    } catch (e) {
                        console.warn('Could not load', meta.file, e);
                    }
                    setText('playLabel', `gathering the loops… ${++done} of ${index.stems.length}`);
                }
            };
            await Promise.all([load(), load(), load()]);
            stems.sort((a, b) => a.name.localeCompare(b.name));
            pruneOldLoops();
            buildGraph();
            setText('playLabel', 'tuning up…');
            await Promise.all(likely().map(stem => decode(stem).catch(() => null)));
            stems = stems.filter(stem => !stem.broken);
            document.getElementById('playBtn').disabled = !stems.length;
            setText('playLabel', stems.length ? 'tap to play' : 'no loops found');
            renderPlayer();
            requestTempo();
        }

        function decode(stem) {
            if (stem.original) return Promise.resolve(stem.original);
            if (!stem.decoding) {
                stem.decoding = new Promise((resolve, reject) => ctx.decodeAudioData(stem.data.slice(0), resolve, reject))
                    .then(decoded => {
                        stem.original = exactLoop(decoded);
                        stem.decoding = null;
                        return stem.original;
                    })
                    .catch(e => {
                        console.warn('Could not decode', stem.file, e);
                        stem.broken = true;
                        stem.decoding = null;
                        throw e;
                    });
            }
            return stem.decoding;
        }

        // Ready to play at this tempo: decoded, and re-timed if need be
        async function ensureReady(stem, bpm) {
            await decode(stem);
            return isBase(bpm) ? stem.original : stretch(stem, bpm);
        }

        function exactLoop(decoded) {
            const rate = ctx.sampleRate / index.sampleRate;
            const start = Math.round(index.pad * rate);
            const length = Math.round(index.frames * rate);
            const buffer = ctx.createBuffer(decoded.numberOfChannels, length, ctx.sampleRate);
            for (let ch = 0; ch < decoded.numberOfChannels; ch++) {
                buffer.copyToChannel(decoded.getChannelData(ch).subarray(start, start + length), ch);
            }
            return buffer;
        }

        function makeStem(meta, data) {
            const moods = index.moods;
            const place = moods.indexOf(meta.mood);
            return {
                ...meta, data, original: null, buffers: new Map(),
                energyAt: (meta.energy - 1) / 2,
                moodAt: place < 0 ? 0.5 : place / Math.max(1, moods.length - 1),
                color: colorFor(meta.instrument), angle: hash(meta.instrument) % 628 / 100,
                lastHeard: -1e9
            };
        }

        // Replaced stems get new file names, so old copies in the offline cache can go
        async function pruneOldLoops() {
            if (!('caches' in window)) return;
            const current = new Set(index.stems.map(s => s.file));
            for (const key of await caches.keys()) {
                if (!key.startsWith('ilvry-')) continue;
                const cache = await caches.open(key);
                for (const request of await cache.keys()) {
                    const file = decodeURIComponent(request.url.split('/loops/')[1] || '');
                    if (file.endsWith('.mp3') && !current.has(file)) cache.delete(request);
                }
            }
        }

        // ---- Tempo ----
        // Gait changes the tempo without changing the pitch. A worker re-times each loop (WSOLA:
        // it re-lays the sound in short overlapping slices, each nudged to line up with the last),
        // treating the loop as a circle so the result still loops seamlessly. The new versions
        // take over together, on a bar line.

        function gaitFor(bpm) {
            const [low, high] = index.tempoRange;
            return Math.max(0, Math.min(1, (bpm - low) / (high - low)));
        }

        function gaitBpm() {
            const [low, high] = index.tempoRange;
            return Math.round((low + settings.gait * (high - low)) * 2) / 2;
        }

        // Every loop at a given tempo has the same length, in seconds
        function loopSeconds(bpm) {
            const frames = Math.round(index.frames * ctx.sampleRate / index.sampleRate);
            return Math.round(frames * index.bpm / bpm) / ctx.sampleRate;
        }

        function isBase(bpm) {
            return Math.abs(bpm - index.bpm) < 0.01;
        }

        function bufferFor(stem, bpm) {
            return isBase(bpm) ? stem.original : stem.buffers.get(bpm) || null;
        }

        function wsolaWorker() {
            const W = 4096;
            const HOP = W / 2;
            const SEARCH = 512;
            const DOWN = 4;
            const window = new Float32Array(W).map((_, i) => 0.5 - 0.5 * Math.cos(2 * Math.PI * i / W));

            self.onmessage = event => {
                const { id, channels, outLength } = event.data;
                const L = channels[0].length;
                const M = outLength;
                const frames = Math.max(2, Math.round(M / HOP));
                // A quarter-rate mono copy, for finding where the slices line up
                const small = new Float32Array(Math.ceil(L / DOWN));
                for (let i = 0; i < small.length; i++) {
                    let sum = 0;
                    for (let ch = 0; ch < channels.length; ch++) for (let j = 0; j < DOWN; j++) sum += channels[ch][(i * DOWN + j) % L];
                    small[i] = sum;
                }
                const S = small.length;
                const overlap = HOP / DOWN;
                const reach = SEARCH / DOWN;

                const out = channels.map(() => new Float32Array(M));
                const weight = new Float32Array(M);
                let previous = 0;
                for (let k = 0; k < frames; k++) {
                    const outAt = Math.round(k * M / frames);
                    const nominal = Math.round(k * L / frames);
                    let from = 0;
                    if (k > 0) {
                        // Where the last slice would naturally have carried on to
                        const hop = outAt - Math.round((k - 1) * M / frames);
                        const natural = Math.round((previous + hop) / DOWN);
                        let best = -Infinity;
                        let bestShift = 0;
                        for (let shift = -reach; shift <= reach; shift++) {
                            const start = Math.round(nominal / DOWN) + shift;
                            let score = 0;
                            for (let i = 0; i < overlap; i += 2) {
                                score += small[((natural + i) % S + S) % S] * small[((start + i) % S + S) % S];
                            }
                            if (score > best) {
                                best = score;
                                bestShift = shift;
                            }
                        }
                        from = ((nominal + bestShift * DOWN) % L + L) % L;
                    }
                    for (let ch = 0; ch < channels.length; ch++) {
                        const input = channels[ch];
                        const output = out[ch];
                        for (let i = 0; i < W; i++) output[(outAt + i) % M] += window[i] * input[(from + i) % L];
                    }
                    for (let i = 0; i < W; i++) weight[(outAt + i) % M] += window[i];
                    previous = from;
                }
                for (let i = 0; i < M; i++) {
                    const w = weight[i] > 1e-3 ? 1 / weight[i] : 0;
                    for (let ch = 0; ch < out.length; ch++) out[ch][i] *= w;
                }
                self.postMessage({ id, channels: out }, out.map(c => c.buffer));
            };
        }

        const worker = new Worker(URL.createObjectURL(new Blob([`(${wsolaWorker.toString()})()`], { type: 'text/javascript' })));
        const jobs = new Map();
        let jobId = 0;
        worker.onmessage = event => {
            const job = jobs.get(event.data.id);
            jobs.delete(event.data.id);
            job(event.data.channels);
        };

        function stretch(stem, bpm) {
            if (bufferFor(stem, bpm)) return Promise.resolve(bufferFor(stem, bpm));
            if (!stem.pending) stem.pending = new Map();
            if (stem.pending.has(bpm)) return stem.pending.get(bpm);
            const original = stem.original;
            const outLength = Math.round(loopSeconds(bpm) * ctx.sampleRate);
            const channels = Array.from({ length: original.numberOfChannels }, (_, ch) => original.getChannelData(ch).slice());
            const promise = new Promise(resolve => {
                const id = ++jobId;
                jobs.set(id, out => {
                    const buffer = ctx.createBuffer(out.length, outLength, ctx.sampleRate);
                    out.forEach((data, ch) => buffer.copyToChannel(data, ch));
                    stem.buffers.set(bpm, buffer);
                    stem.pending.delete(bpm);
                    resolve(buffer);
                });
                worker.postMessage({ id, channels, outLength }, channels.map(c => c.buffer));
            });
            stem.pending.set(bpm, promise);
            return promise;
        }

        let wantedBpm = null;
        let readyBpm = null;
        let tempoTimer = null;

        function requestTempo() {
            clearTimeout(tempoTimer);
            tempoTimer = setTimeout(async () => {
                const bpm = gaitBpm();
                if (bpm === wantedBpm) return;
                wantedBpm = bpm;
                // What's playing first, so the change can be heard soon; then what's likely next
                await Promise.all(voices.map(v => ensureReady(v.stem, bpm)));
                if (wantedBpm !== bpm) return;
                readyBpm = bpm;
                prepare();
            }, 250);
        }

        // The stems the engine is likely to reach for next: what's playing, and the best few
        // fits for each part at the current slider settings
        function likely() {
            const keep = new Set(voices.map(v => v.stem));
            ['bed', 'low', 'rhythm', 'tune'].forEach(role => {
                stems.filter(s => s.role === role && !s.broken).sort((a, b) => score(b) - score(a)).slice(0, role === 'tune' ? 4 : 2).forEach(s => keep.add(s));
            });
            return [...keep];
        }

        // Get the likely stems ready at the tempo they'll play at, and let go of the rest
        let prepTimer = null;
        let preparing = false;

        function prepare() {
            clearTimeout(prepTimer);
            prepTimer = setTimeout(async () => {
                if (preparing) return prepare();
                preparing = true;
                const bpm = readyBpm ?? index.bpm;
                const keep = likely();
                for (const stem of keep) {
                    if ((readyBpm ?? index.bpm) !== bpm) break;
                    await ensureReady(stem, bpm).catch(() => null);
                }
                const tempos = new Set([bpm, clock && clock.bpm]);
                const wanted = new Set([...likely(), ...voices.map(v => v.stem)]);
                // Away from the loops' own tempo, a re-timed copy is all that's needed; the original
                // can be decoded again from the MP3 if the tempo comes back
                const offBase = [...tempos].every(t => t === null || t === undefined || !isBase(t));
                stems.forEach(stem => {
                    [...stem.buffers.keys()].forEach(key => { if (!tempos.has(key) || !wanted.has(stem)) stem.buffers.delete(key); });
                    if (stem.decoding || (stem.pending && stem.pending.size)) return;
                    if (!wanted.has(stem) || (offBase && stem.buffers.size)) stem.original = null;
                });
                preparing = false;
            }, 400);
        }

        // ---- Sound ----

        let master = null;
        let mix = null;
        let shade = null;
        let drone = null;

        function keyIndex(name) {
            const names = { 'C': 0, 'C#': 1, 'Db': 1, 'D': 2, 'D#': 3, 'Eb': 3, 'E': 4, 'F': 5, 'F#': 6, 'Gb': 6, 'G': 7, 'G#': 8, 'Ab': 8, 'A': 9, 'A#': 10, 'Bb': 10, 'B': 11 };
            return names[String(name).replace('♯', '#').replace('♭', 'b')] ?? 2;
        }

        // Hum adds Front Porch's voices one at a time, root first; all six at the top
        const HUM_ORDER = ['root', 'fifth', 'low', 'high', 'ninth', 'tenth'];

        // The hum is never still: voices swell and sink on their own, and any but the root may
        // drop out for a while and ease back in. glow brightens the tone a little as voices surge.
        const humLife = { resting: new Set(), swell: {}, glow: 0, timer: null };

        function humVoices() {
            const hum = settings.hum;
            const count = hum < 0.02 ? 0 : Math.min(HUM_ORDER.length, 1 + Math.floor(hum * HUM_ORDER.length));
            return HUM_ORDER.slice(0, count);
        }

        function tuneDrone(fade) {
            if (!drone) return;
            const hum = settings.hum;
            const voices = humVoices().filter(id => !humLife.resting.has(id));
            drone.set({
                voices, swell: humLife.swell, fade,
                level: voices.length ? 0.3 + 0.4 * hum : 0,
                tone: 30 + 30 * settings.hour + 10 * humLife.glow,
                mingle: Math.round(25 + 50 * settings.kindling)
            });
        }

        function liveHum() {
            clearTimeout(humLife.timer);
            if (!playing) return;
            const all = humVoices();
            const id = all[Math.floor(Math.random() * all.length)];
            if (id) {
                // Every other voice settles part of the way back toward its usual level
                all.forEach(v => { if (v !== id && humLife.swell[v] !== undefined) humLife.swell[v] = 1 + (humLife.swell[v] - 1) * 0.55; });
                const resting = humLife.resting.has(id);
                if (resting) {
                    humLife.resting.delete(id);                    // back it comes
                    humLife.swell[id] = 0.6 + Math.random() * 0.5;
                } else if (id !== 'root' && humLife.resting.size < all.length - 2 && Math.random() < 0.35) {
                    humLife.resting.add(id);                       // it sinks away for a while
                } else {
                    humLife.swell[id] = 0.45 + Math.random() * 0.85; // a surge, or an ebb
                }
                // The strongest surge among the voices that are sounding sets the glow
                const surge = Math.max(0, ...all.filter(v => !humLife.resting.has(v)).map(v => (humLife.swell[v] ?? 1) - 1));
                humLife.glow = Math.min(1, surge / 0.3);
                tuneDrone(2 + Math.random() * 3);
            }
            humLife.timer = setTimeout(liveHum, (3 + Math.random() * 6) * 1000);
        }

        // A soft room, made from decaying noise
        function makeRoom(seconds) {
            const length = Math.round(ctx.sampleRate * seconds);
            const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
            let seed = 7;
            for (let ch = 0; ch < 2; ch++) {
                const data = impulse.getChannelData(ch);
                for (let i = 0; i < length; i++) {
                    seed = (seed * 16807) % 2147483647;
                    data[i] = ((seed - 1) / 2147483646 * 2 - 1) * Math.pow(1 - i / length, 3.2);
                }
            }
            return impulse;
        }

        function buildGraph() {
            const compressor = ctx.createDynamicsCompressor();
            compressor.threshold.value = -16;
            compressor.ratio.value = 3;
            master = ctx.createGain();
            master.gain.value = 0;
            master.connect(compressor).connect(ctx.destination);
            // Hour also shades the whole sound: darker at dusk, open at dawn
            shade = ctx.createBiquadFilter();
            shade.type = 'lowpass';
            shade.Q.value = 0.5;
            shade.connect(master);
            mix = ctx.createGain();
            mix.gain.value = 0.55;
            const room = ctx.createConvolver();
            room.buffer = makeRoom(2.8);
            const wet = ctx.createGain();
            wet.gain.value = 0.22;
            mix.connect(shade);
            mix.connect(room).connect(wet).connect(shade);
            const humBus = ctx.createGain();
            humBus.connect(master);
            const humRoom = ctx.createGain();
            humRoom.gain.value = 0.35;
            humBus.connect(humRoom).connect(room);
            drone = makeDrone(ctx, humBus, keyIndex(index.drone.key), index.drone.octave);
            applyShade(true);
            tuneDrone();
        }

        function applyShade(immediate) {
            if (!shade) return;
            const cutoff = 2600 * Math.pow(2, settings.hour * 2.8);
            shade.frequency.setTargetAtTime(cutoff, ctx.currentTime, immediate ? 0.01 : 0.6);
        }

        // ---- The hum: Drone, inside ----
        // This is Drone's own sound engine (github.com/mgilvryallen/drone), copied in unchanged but
        // for where its sound goes, how loud, and how slowly its voices change level when ilvry
        // asks: three reeds per voice, buzz, bellows, blooms, the undertow, air, and Mingle's
        // strays and glides. It runs as Front Porch. Hum decides how many of Front Porch's voices
        // it can use; Hour moves its tone, Kindling its Mingle; and on its own it lets voices
        // swell, fade, drop out and come back.
        function makeDrone(context, output, key, octave) {
            let level = 0;
            let fade = null; // when ilvry sets it: how slowly voices move to new levels (seconds)
            const settings = {
                key, octave, cents: 0, mingle: 50, tone: 45, breath: 50,
                voices: {}, levels: {}
            };

            const VOICES = [
                { id: 'low', label: 'Low root', ratio: [1, 2], level: 70, color: 'var(--indigo)' },
                { id: 'lowfourth', label: 'Low 4th', ratio: [2, 3], level: 50, color: 'var(--slate)' },
                { id: 'root', label: 'Root', ratio: [1, 1], level: 100, color: 'var(--rust)' },
                { id: 'fourth', label: '4th', ratio: [4, 3], level: 55, color: 'var(--ochre)' },
                { id: 'fifth', label: '5th', ratio: [3, 2], level: 80, color: 'var(--green)' },
                { id: 'sixth', label: '6th', ratio: [27, 16], level: 40, color: 'var(--plum)' },
                { id: 'seventh', label: '♭7th', ratio: [16, 9], level: 35, color: 'var(--berry)' },
                { id: 'high', label: 'Octave', ratio: [2, 1], level: 45, color: 'var(--woad)' },
                { id: 'ninth', label: '9th', ratio: [9, 4], level: 35, color: 'var(--teal)' },
                { id: 'tenth', label: '10th', ratio: [5, 2], level: 35, color: 'var(--moss)' }
            ];
            VOICES.forEach(v => {
                settings.voices[v.id] = false;
                settings.levels[v.id] = v.level;
            });

            function rootFrequency() {
                const midi = 12 * (settings.octave + 1) + settings.key;
                return 440 * Math.pow(2, (midi - 69) / 12) * Math.pow(2, settings.cents / 1200);
            }

            function ratioOf(voice) {
                const [n, d] = voice.ratio;
                return n / d;
            }

            // ---- Sound engine ----
            // Each voice is three slightly detuned "reeds" (like a shruti box's reed banks) playing a
            // reed-like waveform, panned apart so they beat and shimmer against each other. They run
            // through a soft saturator (a little buzz), a tone filter, and two nasal resonances. Slow
            // drifting LFOs move the volume and brightness like a bellows; a little filtered noise adds air.

            const REED_DETUNES = [[-3.5, 0, 4.2], [-3.3, 0.3, 3.4], [-2.6, 0.4, 3.1], [-3.2, 0.2, 3.5], [-4.1, -0.3, 2.7], [-2.9, 0.5, 4], [-3.4, 0.1, 3.9], [-3, 0.6, 3.8], [-3.6, -0.2, 3.3], [-2.7, 0.3, 3.6]];
            const WANDER_DETUNES = [[-3.1, 0.2, 3.7]];

            let engine = null;
            let playing = false;

            // Seeded random so the waveform is the same every time
            function seededRandom(seed) {
                return () => {
                    seed = (seed * 16807) % 2147483647;
                    return (seed - 1) / 2147483646;
                };
            }

            function reedWave(context) {
                const count = 48;
                const real = new Float32Array(count + 1);
                const imag = new Float32Array(count + 1);
                const random = seededRandom(7);
                for (let n = 1; n <= count; n++) {
                    let amp = Math.pow(n, -0.78);
                    if (n % 2 === 0) amp *= 0.72;            // reeds lean toward odd harmonics
                    if (n >= 3 && n <= 7) amp *= 1.3;         // a nasal bump in the low-mid harmonics
                    const phase = random() * Math.PI * 2;     // scattered phases soften the peaks
                    real[n] = amp * Math.sin(phase);
                    imag[n] = amp * Math.cos(phase);
                }
                return context.createPeriodicWave(real, imag);
            }

            function softClipCurve(drive) {
                const curve = new Float32Array(2048);
                for (let i = 0; i < curve.length; i++) {
                    const x = (i / (curve.length - 1)) * 2 - 1;
                    curve[i] = Math.tanh(drive * x) / Math.tanh(drive);
                }
                return curve;
            }

            function createEngine(context) {
                const now = context.currentTime;

                const master = context.createGain();
                master.gain.value = 0;
                master.connect(output);

                const bellows = context.createGain();
                bellows.gain.value = 1;
                bellows.connect(master);

                const nasal1 = context.createBiquadFilter();
                nasal1.type = 'peaking';
                nasal1.frequency.value = 1100;
                nasal1.Q.value = 1.2;
                nasal1.gain.value = 4;
                const nasal2 = context.createBiquadFilter();
                nasal2.type = 'peaking';
                nasal2.frequency.value = 2700;
                nasal2.Q.value = 1.6;
                nasal2.gain.value = 2.5;
                nasal1.connect(nasal2).connect(bellows);

                const tone = context.createBiquadFilter();
                tone.type = 'lowpass';
                tone.Q.value = 0.6;
                tone.connect(nasal1);

                const buzz = context.createWaveShaper();
                buzz.curve = softClipCurve(1.8);
                buzz.oversample = '2x';
                buzz.connect(tone);

                // Everything feeds the buzz through here, so the drive can ease off as voices stack up
                const mix = context.createGain();
                mix.connect(buzz);

                // Bellows: two slow LFOs at unrelated rates, so the movement never quite repeats
                const lfoA = context.createOscillator();
                lfoA.frequency.value = 0.11;
                const lfoB = context.createOscillator();
                lfoB.frequency.value = 0.067;
                const ampDepth = context.createGain();
                ampDepth.gain.value = 0;
                const filterDepth = context.createGain();
                filterDepth.gain.value = 0;
                const filterDepthB = context.createGain();
                filterDepthB.gain.value = 0;
                lfoA.connect(ampDepth).connect(bellows.gain);
                lfoA.connect(filterDepth).connect(tone.frequency);
                lfoB.connect(filterDepthB).connect(tone.frequency);
                lfoA.start(now);
                lfoB.start(now);

                // Air: looped noise through a band-pass
                const noiseBuffer = context.createBuffer(1, context.sampleRate * 2, context.sampleRate);
                const data = noiseBuffer.getChannelData(0);
                const random = seededRandom(11);
                for (let i = 0; i < data.length; i++) data[i] = random() * 2 - 1;
                const noise = context.createBufferSource();
                noise.buffer = noiseBuffer;
                noise.loop = true;
                const air = context.createBiquadFilter();
                air.type = 'bandpass';
                air.frequency.value = 1800;
                air.Q.value = 0.7;
                const airGain = context.createGain();
                airGain.gain.value = 0;
                noise.connect(air).connect(airGain).connect(bellows);
                noise.start(now);

                // Bloom: much slower movements under the bellows, minutes long. The tone opens and closes,
                // and the nasal resonance drifts and rings a little brighter, then settles
                const bloomTone = context.createOscillator();
                bloomTone.frequency.value = 1 / 110;
                const bloomToneDepth = context.createGain();
                bloomTone.connect(bloomToneDepth).connect(tone.frequency);
                const bloomRing = context.createOscillator();
                bloomRing.frequency.value = 1 / 140;
                const ringQ = context.createGain();
                ringQ.gain.value = 0.5;
                bloomRing.connect(ringQ).connect(nasal1.Q);
                const bloomDrift = context.createOscillator();
                bloomDrift.frequency.value = 1 / 190;
                const driftHz = context.createGain();
                driftHz.gain.value = 70;
                bloomDrift.connect(driftHz).connect(nasal1.frequency);
                [bloomTone, bloomRing, bloomDrift].forEach(lfo => lfo.start(now));

                // Undertow: slower and slighter still, felt more than heard. Over three to five
                // minutes the whole sound leans a little louder and pushes a little harder into the
                // buzz, then eases back. It waits a minute after play, then comes in over another
                // minute and a half (see stirUndertow).
                const undertowA = context.createOscillator();
                undertowA.frequency.value = 1 / 200;
                const undertowB = context.createOscillator();
                undertowB.frequency.value = 1 / 290;
                const undertowVolume = context.createGain();
                undertowVolume.gain.value = 0;
                const undertowDrive = context.createGain();
                undertowDrive.gain.value = 0;
                undertowA.connect(undertowVolume).connect(bellows.gain);
                undertowB.connect(undertowDrive).connect(mix.gain);
                [undertowA, undertowB].forEach(lfo => lfo.start(now));

                const eng = { ctx: context, wave: reedWave(context), buzz, mix, master, tone, nasal2, ampDepth, filterDepth, filterDepthB, bloomToneDepth, undertowVolume, undertowDrive, air, airGain, voices: {}, lastRoot: null, last: {} };
                // A spare reed bank for Mingle's wandering notes
                eng.wanderers = WANDER_DETUNES.map(detunes => makeReeds(eng, detunes));
                return eng;
            }

            // Three reeds -> level gain -> swell (each voice blooms and sinks over a minute or more, at
            // its own rate) -> duck gain (Mingle dips a voice a touch while it's wandering) -> buzz
            function makeReeds(eng, detunes, seed) {
                const c = eng.ctx;
                const gain = c.createGain();
                gain.gain.value = 0;
                const swell = c.createGain();
                swell.gain.value = 0.93;
                const bloom = c.createOscillator();
                bloom.frequency.value = 1 / (70 + 13 * ((seed ?? 3) * 7 % 9));
                const bloomDepth = c.createGain();
                bloomDepth.gain.value = 0.07;
                bloom.connect(bloomDepth).connect(swell.gain);
                bloom.start(c.currentTime);
                const duck = c.createGain();
                gain.connect(swell).connect(duck).connect(eng.mix);
                const oscillators = detunes.map((detune, r) => {
                    const osc = c.createOscillator();
                    osc.setPeriodicWave(eng.wave);
                    osc.detune.value = detune;
                    const reedGain = c.createGain();
                    reedGain.gain.value = 0.11;
                    const pan = c.createStereoPanner();
                    pan.pan.value = [-0.45, 0, 0.45][r];
                    osc.connect(reedGain).connect(pan).connect(gain);
                    osc.start(c.currentTime);
                    return osc;
                });
                return { gain, duck, oscillators, detunes, busyUntil: -1, sourceId: null };
            }

            function stirUndertow(eng, t) {
                [[eng.undertowVolume, 0.055], [eng.undertowDrive, 0.05]].forEach(([depth, amount]) => {
                    depth.gain.cancelScheduledValues(t);
                    depth.gain.setValueAtTime(0, t);
                    depth.gain.setValueAtTime(0, t + 60);
                    depth.gain.linearRampToValueAtTime(amount, t + 150);
                });
            }

            function stillUndertow(eng, t) {
                [eng.undertowVolume, eng.undertowDrive].forEach(depth => {
                    depth.gain.cancelScheduledValues(t);
                    depth.gain.setTargetAtTime(0, t, 1);
                });
            }

            // Voices are only built once they're first turned on, to spare the phone's processor
            function voiceNodes(eng, voice) {
                if (!eng.voices[voice.id]) eng.voices[voice.id] = makeReeds(eng, REED_DETUNES[VOICES.indexOf(voice)], VOICES.indexOf(voice));
                return eng.voices[voice.id];
            }

            function levelOf(voice) {
                return settings.voices[voice.id] ? settings.levels[voice.id] / 100 : 0;
            }

            // With lots of voices on, pull them all down together so the reeds don't pile into the buzz,
            // but only part of the way: each voice added still makes the whole a little fuller and
            // louder, the way it would on a real box
            function blendFactor() {
                const total = VOICES.reduce((sum, voice) => sum + levelOf(voice), 0);
                return Math.min(1, Math.pow(1.9 / Math.max(total, 0.001), 0.15));
            }

            // Tone: the top of the range opens up more gently than the bottom, so bright isn't harsh
            // More voices means more overtones and more drive into the buzz, so a big stack turns harsh.
            // Past two voices, each extra one eases the drive and darkens the tone a little.
            function activeVoiceCount() {
                return VOICES.filter(voice => levelOf(voice) > 0).length;
            }

            function stackDarkening() {
                return Math.max(0.7, 1 - 0.035 * Math.max(0, activeVoiceCount() - 2));
            }

            // A little less easing than it once had, so a stack pushes into the buzz together and fuses
            function stackDrive() {
                return 1 / (1 + 0.09 * Math.max(0, activeVoiceCount() - 2));
            }

            function toneCutoff() {
                const t = settings.tone / 100;
                const octaves = t <= 0.45 ? t * 4.2 : 1.89 + (t - 0.45) * 2.3;
                return 450 * Math.pow(2, octaves) * stackDarkening();
            }

            function applyAll(eng, immediate) {
                if (!eng) return;
                const t = eng.ctx.currentTime;
                const glide = immediate ? 0.001 : 0.04;
                const root = rootFrequency();
                const blend = blendFactor();

                // A new key or tuning would leave any wandering note stranded, so let it go
                if (eng.lastRoot && Math.abs(root / eng.lastRoot - 1) > 1e-6) releaseWanderers(eng);
                eng.lastRoot = root;

                // Changes you make (a level slider, the tone) answer quickly; the room the rest of the
                // stack makes for a voice coming or going is made slowly, so nothing seems to duck.
                // A voice turned on fades in over a couple of seconds.
                const last = eng.last;
                const slow = immediate ? 0.001 : 1.2;
                VOICES.forEach(voice => {
                    if (!settings.voices[voice.id] && !eng.voices[voice.id]) return;
                    const { gain, oscillators } = voiceNodes(eng, voice);
                    oscillators.forEach(osc => osc.frequency.setTargetAtTime(root * ratioOf(voice), t, glide));
                    const on = Boolean(settings.voices[voice.id]);
                    const toggled = last[voice.id] !== undefined && last[voice.id].on !== on;
                    const moved = last[voice.id] !== undefined && last[voice.id].level !== settings.levels[voice.id];
                    const time = immediate ? 0.001 : fade ?? (toggled ? 0.6 : moved && on ? 0.12 : slow);
                    gain.gain.setTargetAtTime(levelOf(voice) * blend, t, time);
                    last[voice.id] = { on, level: settings.levels[voice.id] };
                });

                const cutoff = toneCutoff();
                const toneMoved = last.tone !== undefined && last.tone !== settings.tone;
                eng.mix.gain.setTargetAtTime(stackDrive(), t, slow);
                const breath = settings.breath / 100;
                eng.tone.frequency.setTargetAtTime(cutoff, t, immediate || toneMoved ? 0.08 : slow);
                eng.bloomToneDepth.gain.setTargetAtTime(cutoff * 0.08, t, 0.5);
                last.tone = settings.tone;
                eng.nasal2.gain.setTargetAtTime(2.5 - Math.max(0, settings.tone - 45) / 55 * 3, t, 0.08);
                // Breath is mostly shimmer: it spreads each voice's three reeds further apart in tuning,
                // so they beat against each other faster and wider. The bellows sway stays gentle.
                const spread = 0.35 + breath * 1.9;
                [...Object.values(eng.voices), ...eng.wanderers].forEach(reeds => {
                    reeds.oscillators.forEach((osc, i) => osc.detune.setTargetAtTime(reeds.detunes[i] * spread, t, immediate ? 0.001 : 0.3));
                });
                eng.ampDepth.gain.setTargetAtTime(breath * 0.05, t, 0.2);
                eng.filterDepth.gain.setTargetAtTime(breath * cutoff * 0.1, t, 0.2);
                eng.filterDepthB.gain.setTargetAtTime(breath * cutoff * 0.06, t, 0.2);
                // Air rides with Tone: the brighter it gets, the more breath you hear in the reeds
                eng.airGain.gain.setTargetAtTime((0.003 + (settings.tone / 100) * 0.008) * stackDrive(), t, 0.2);

                const volumeMoved = last.volume !== undefined && last.volume !== settings.volume;
                last.volume = settings.volume;
                if (eng === engine && playing) eng.master.gain.setTargetAtTime(volumeLevel(), t, volumeMoved ? 0.08 : slow);
            }

            function volumeLevel() {
                // The loudness the stack loses going easier into the buzz comes back here, after it, where it adds no grit
                return level * 0.46 / stackDrive();
            }

            // ---- Mingle ----
            // A spare reed bank fades in on top of an active voice at the same pitch (so you can't hear
            // it arrive), takes slow, gooey slides along a path (out to a nearby dissonance and home,
            // or from one voice that's on to another, where it settles and fades out). The voice it grew out of keeps playing, dipped just a little so the
            // total loudness stays about even. One at a time, at random, spaced-out moments. The slider
            // sets how loud the strays get as well as how often: half as loud at the bottom, full at the top.

            // Each move is a path of pitches (ratios of the root) the stray note slides through. It
            // fades in on the first and, if the last is a voice that's playing, settles into it and
            // fades out there; a path ending where it began is a lean away and back. needs: voices
            // that must be on; unless: voices that hand the move over to a bigger one. hang: a stop on
            // the way to linger on. sparse: only when no more than this many voices are on. level: how
            // loud the stray gets next to the voices; the common leans are kept faint, a shadow
            // rather than a second voice.
            const MINGLE_MOVES = [
                { path: [2, 15 / 8, 2], needs: ['high'], weight: 1, level: 0.32 },             // octave leans down to the major 7th
                { path: [3 / 2, 45 / 32, 3 / 2], needs: ['fifth'], sparse: 3, weight: 0.5, level: 0.15 },   // 5th sinks to the tritone (only when little else is on)
                { path: [4 / 3, 45 / 32, 4 / 3], needs: ['fourth'], sparse: 3, weight: 0.5, level: 0.15 },  // 4th rises to the tritone (likewise)
                { path: [5 / 2, 8 / 3, 5 / 2], needs: ['tenth'], weight: 0.12, level: 0.45 },   // 10th lifts to the 11th
                { path: [1, 15 / 16, 1], needs: ['root'], weight: 0.08, level: 0.4 },           // root dips a half step
                { path: [1, 9 / 8, 1], needs: ['root'], weight: 0.08, level: 0.4 },             // root climbs a whole step

                // Glides between voices that are on
                { path: [4 / 3, 3 / 2], needs: ['fourth', 'fifth'], unless: ['sixth'], weight: 0.5, level: 0.4 },   // 4th up to the 5th
                { path: [3 / 2, 4 / 3], needs: ['fourth', 'fifth'], unless: ['sixth'], weight: 0.2, level: 0.4 },   // 5th down to the 4th
                { path: [4 / 3, 27 / 16], needs: ['fourth', 'sixth'], unless: ['fifth'], weight: 0.5, level: 0.4 }, // 4th up to the 6th
                { path: [27 / 16, 4 / 3], needs: ['fourth', 'sixth'], unless: ['fifth'], weight: 0.2, level: 0.4 }, // 6th down to the 4th
                { path: [4 / 3, 27 / 16, 3 / 2], needs: ['fourth'], weight: 0.5, level: 0.4 },                     // 4th up to the 6th, settling on the 5th (6th and 5th needn't be on)
                { path: [27 / 16, 4 / 3, 3 / 2], needs: ['fourth', 'fifth', 'sixth'], weight: 0.3, level: 0.4 },   // 6th down to the 4th, up to the 5th
                { path: [9 / 4, 15 / 8, 2], needs: ['ninth', 'high'], weight: 0.4, level: 0.35 },                  // 9th down through the 7th to the octave
                { path: [2, 15 / 8, 9 / 4, 2], hang: 2, needs: ['ninth', 'high'], weight: 0.25, level: 0.35 },      // octave down to the 7th, up to the 9th, lingers, home
                { path: [2, 5 / 2, 9 / 4], resolve: 'high', needs: ['ninth', 'tenth'], weight: 0.35, level: 0.35 }, // octave up to the 10th, down to the 9th (and home to the octave if it's on)
                { path: [5 / 2, 2, 9 / 4], resolve: 'high', needs: ['ninth', 'tenth'], weight: 0.25, level: 0.35 }  // 10th down to the octave, up to the 9th (and home)
            ];

            function voiceAt(ratio) {
                return VOICES.find(v => Math.abs(ratioOf(v) - ratio) < 1e-6 && levelOf(v) > 0);
            }

            // Frequency points for a slow-in, slow-out slide (even steps in pitch, not in Hz)
            function glideCurve(from, to) {
                const curve = new Float32Array(64);
                for (let i = 0; i < curve.length; i++) {
                    const x = i / (curve.length - 1);
                    const ease = x * x * x * (x * (x * 6 - 15) + 10);
                    curve[i] = from * Math.pow(to / from, ease);
                }
                return curve;
            }

            // Returns when the wandering will be over, or null if nothing could wander
            function wander(eng, t0, rand) {
                if (settings.mingle <= 0 || eng.wanderers.some(w => w.busyUntil > t0)) return null;
                const isOn = id => levelOf(VOICES.find(v => v.id === id)) > 0;
                const count = activeVoiceCount();
                const moves = MINGLE_MOVES.filter(move => move.needs.every(isOn) && !(move.unless || []).some(isOn) && !(move.sparse && count > move.sparse));
                if (!moves.length) return null;
                let pick = rand() * moves.reduce((sum, move) => sum + move.weight, 0);
                const move = moves.find(m => (pick -= m.weight) <= 0) || moves[0];
                const path = move.resolve && isOn(move.resolve) ? [...move.path, ratioOf(VOICES.find(v => v.id === move.resolve))] : move.path;
                const source = voiceAt(path[0]) || VOICES.find(v => v.id === move.needs[0]);
                const wanderer = eng.wanderers[0];
                const root = rootFrequency();

                // Slide from point to point, lingering briefly at each stop on the way
                const fadeIn = 1.6;
                let at = t0 + fadeIn * 0.85;
                const steps = [];
                for (let i = 1; i < path.length; i++) {
                    const slide = 1.6 + rand() * 1.0;
                    steps.push({ from: root * path[i - 1], to: root * path[i], at, slide });
                    at += slide;
                    if (i < path.length - 1) at += i === move.hang ? 2 + rand() * 1.5 : 0.4 + rand() * 1.0;
                }
                const home = at + 0.5;
                const fadeOut = 1.4;
                const end = home + fadeOut;
                const strength = move.level * (0.5 + 0.5 * settings.mingle / 100);
                const level = levelOf(source) * blendFactor() * strength;
                // Dip the voice it grew from only as much as the stray note adds, so loudness holds steady
                const dip = 1 - strength * 0.23;

                wanderer.oscillators.forEach(osc => {
                    osc.frequency.cancelScheduledValues(t0);
                    osc.frequency.setValueAtTime(root * path[0], t0);
                    steps.forEach(step => osc.frequency.setValueCurveAtTime(glideCurve(step.from, step.to), step.at, step.slide));
                });
                const g = wanderer.gain.gain;
                g.cancelScheduledValues(t0);
                g.setValueAtTime(0, t0);
                g.linearRampToValueAtTime(level, t0 + fadeIn);
                g.setValueAtTime(level, home);
                g.linearRampToValueAtTime(0, end);

                const duck = voiceNodes(eng, source).duck.gain;
                duck.cancelScheduledValues(t0);
                duck.setValueAtTime(1, t0);
                duck.linearRampToValueAtTime(dip, t0 + fadeIn);
                duck.setValueAtTime(dip, home);
                duck.linearRampToValueAtTime(1, end);

                wanderer.busyUntil = end;
                wanderer.sourceId = source.id;
                return end;
            }

            function releaseWanderers(eng) {
                const t = eng.ctx.currentTime;
                eng.wanderers.forEach(w => {
                    if (w.busyUntil <= t) return;
                    w.gain.gain.cancelScheduledValues(t);
                    w.gain.gain.setTargetAtTime(0, t, 0.06);
                    const source = eng.voices[w.sourceId];
                    if (source) {
                        source.duck.gain.cancelScheduledValues(t);
                        source.duck.gain.setTargetAtTime(1, t, 0.06);
                    }
                    w.busyUntil = t + 0.4;
                });
            }

            // Seconds of plain drone between wanderings: random (sometimes soon, sometimes a long
            // while), averaging about 70s at the low end of the slider, 49s in the middle, and 18s at
            // the top (the last stretch of the slider speeds up a little more)
            function mingleGap(rand) {
                const m = settings.mingle / 100;
                const mean = 75 - 50 * m - 7 * Math.pow(m, 4);
                return Math.max(6, -mean * Math.log(1 - rand() * 0.98));
            }

            let mingleTimer = null;

            function scheduleMingle(wait) {
                clearTimeout(mingleTimer);
                if (!playing || !settings.mingle) return;
                mingleTimer = setTimeout(() => {
                    let next = mingleGap(Math.random);
                    if (playing && engine && !document.hidden) {
                        const now = engine.ctx.currentTime;
                        const end = wander(engine, now + 0.05, Math.random);
                        if (end) next += end - now;
                    }
                    scheduleMingle(next);
                }, (wait === undefined ? mingleGap(Math.random) : wait) * 1000);
            }

            return {
                start() {
                    if (!engine) engine = createEngine(context);
                    playing = true;
                    applyAll(engine, true);
                    const t = context.currentTime;
                    engine.master.gain.cancelScheduledValues(t);
                    engine.master.gain.setTargetAtTime(volumeLevel(), t, 1.2);
                    stirUndertow(engine, t);
                    scheduleMingle();
                },
                stop() {
                    playing = false;
                    clearTimeout(mingleTimer);
                    if (!engine) return;
                    releaseWanderers(engine);
                    stillUndertow(engine, context.currentTime);
                    engine.master.gain.cancelScheduledValues(context.currentTime);
                    engine.master.gain.setTargetAtTime(0, context.currentTime, 0.35);
                },
                set(changes) {
                    const mingleWas = settings.mingle;
                    if (changes.level !== undefined) level = changes.level;
                    if (changes.voices) VOICES.forEach(v => settings.voices[v.id] = changes.voices.includes(v.id));
                    if (changes.swell) VOICES.forEach(v => settings.levels[v.id] = Math.round(v.level * (changes.swell[v.id] ?? 1)));
                    fade = changes.fade ?? null;
                    ['tone', 'mingle'].forEach(name => { if (changes[name] !== undefined) settings[name] = changes[name]; });
                    if (engine) {
                        if (!settings.mingle) releaseWanderers(engine);
                        applyAll(engine, false);
                    }
                    if (playing && !mingleWas !== !settings.mingle) scheduleMingle();
                },
                voiceCount: () => VOICES.filter(v => settings.voices[v.id]).length
            };
        }

        // ---- The engine ----
        // Everything runs off one clock, in bars. Every voice is a stem looping in time with the
        // rest; voices only start and stop on bar lines. Every few bars the engine looks at what's
        // playing against the sliders and may bring a layer in or let one go. Wander sets how often.

        let voices = [];
        let clock = null;      // { start, bar, barTime, bpm }: bar number `bar` begins at time `start`
        let nextBar = 0;
        let unsettled = true;  // a slider moved: look again every bar until things settle
        let ticker = null;
        let playing = false;

        function barStart(n) {
            return clock.start + (n - clock.bar) * clock.barTime;
        }

        function score(stem) {
            const energy = Math.exp(-Math.pow((stem.energyAt - settings.kindling) / 0.38, 2));
            const mood = Math.exp(-Math.pow((stem.moodAt - settings.hour) / 0.42, 2));
            return energy * mood;
        }

        // How restless it is: Kindling carries this too, from lingering embers to a roaming bonfire
        function restlessness() {
            return 0.2 + 0.65 * settings.kindling;
        }

        // How many of each part to have going. With plenty of hum, the drone is the bed.
        function wantedCounts() {
            const has = role => stems.some(s => s.role === role);
            const k = settings.kindling;
            return {
                bed: has('bed') && settings.hum <= 0.5 ? 1 : 0,
                low: has('low') && k > 0.12 ? 1 : 0,
                rhythm: has('rhythm') ? (k > 0.62 ? 2 : k > 0.3 ? 1 : 0) : 0,
                tune: k < 0.5 ? 1 : 2
            };
        }

        function pickWeighted(list, weightOf) {
            const weights = list.map(weightOf);
            let r = Math.random() * weights.reduce((a, b) => a + b, 0);
            return list.find((_, i) => (r -= weights[i]) <= 0) || list[list.length - 1];
        }

        function evaluate(n, at, phrase) {
            const live = voices.filter(v => !v.leaving);
            const used = new Set(live.map(v => v.stem.instrument));
            const counts = wantedCounts();
            const w = restlessness();
            const loopTurn = n % index.bars === 0 ? 1.4 : 1;
            const chance = { tune: 0.18 + 0.6 * w, bed: 0.04 + 0.16 * w, low: 0.06 + 0.2 * w, rhythm: 0.08 + 0.25 * w };
            let changed = false;

            for (const role of ['bed', 'low', 'rhythm', 'tune']) {
                const mine = live.filter(v => v.stem.role === role);
                const candidates = stems.filter(s => s.role === role && !used.has(s.instrument) && bufferFor(s, clock.bpm));
                const fresh = s => Math.pow(score(s), 2) * (n - s.lastHeard < 8 ? 0.35 : 1) + 1e-6;
                const worst = () => mine.reduce((a, b) => score(a.stem) <= score(b.stem) ? a : b);

                if (mine.length > counts[role]) {
                    leave(worst(), at);
                    changed = true;
                } else if (mine.length < counts[role] && candidates.length) {
                    const stem = pickWeighted(candidates, fresh);
                    join(stem, n, at);
                    used.add(stem.instrument);
                    changed = true;
                } else if (mine.length && candidates.length) {
                    const out = worst();
                    const best = candidates.reduce((a, b) => score(a) >= score(b) ? a : b);
                    // Something fits the sliders much better, or it's simply time for a change. A
                    // change of heart only picks from what fits about as well as what it replaces,
                    // so the two never fight (one swapping in a poor fit, the other swapping it back).
                    const misfit = score(out.stem) < score(best) * 0.45;
                    const restless = !misfit && phrase && Math.random() < chance[role] * loopTurn;
                    const going = misfit ? out : pickWeighted(mine, v => 1.2 - score(v.stem));
                    const fitting = candidates.filter(s => score(s) >= score(going.stem) * 0.55);
                    if (misfit || (restless && fitting.length)) {
                        const stem = misfit ? best : pickWeighted(fitting, fresh);
                        leave(going, at);
                        join(stem, n, at);
                        used.add(stem.instrument);
                        changed = true;
                    }
                }
            }
            if (phrase) restSome(n, at);
            if (changed) renderNow();
            return changed;
        }

        // Now and then a layer steps back for a bar or few, almost out, then comes back in. Never
        // the bed, never more than a third of what's playing at once.
        function restSome(n, at) {
            const live = voices.filter(v => !v.leaving && v.stem.role !== 'bed' && n - v.joinedBar >= PHRASE);
            const resting = live.filter(v => v.restUntil > at).length;
            let room = Math.floor(voices.filter(v => !v.leaving).length / 3) - resting;
            const chance = 0.06 + 0.22 * restlessness();
            live.filter(v => !(v.restUntil > at)).forEach(voice => {
                if (room <= 0 || Math.random() > chance) return;
                const bar = clock.barTime;
                const down = 0.12 + Math.random() * 0.25;
                const hold = (1 + Math.floor(Math.random() * 3)) * bar;
                shape(voice, at, [[at + bar, down], [at + bar + hold, down], [at + 2 * bar + hold, 1]]);
                voice.restUntil = at + 2 * bar + hold;
                room--;
            });
        }

        function fadeBars(role, entering) {
            if (role === 'rhythm') return entering ? 1 : 2;
            if (role === 'bed') return 4;
            if (role === 'low') return entering ? 1 : 2;
            return entering ? 2 + 2 * (1 - restlessness()) : 3;
        }

        // A slow wobble for one of a voice's settings: a sine at a rate of its own, so no two
        // layers ever move together and the whole never quite repeats
        function sway(param, center, depth, at) {
            param.value = center;
            const lfo = ctx.createOscillator();
            lfo.frequency.value = 0.018 + Math.random() * 0.05;
            const amount = ctx.createGain();
            amount.gain.value = depth;
            lfo.connect(amount).connect(param);
            lfo.start(at);
            return { lfo, rate: lfo.frequency.value, depth, center, start: at };
        }

        function valueOf(wobble, t) {
            return wobble.center + wobble.depth * Math.sin(2 * Math.PI * wobble.rate * Math.max(0, t - wobble.start));
        }

        // Each voice: its loop -> layer (comes and goes) -> lilt (volume sway) -> tint (brightness
        // sway) -> drift (wanders left and right) -> trim (evens out loudness) -> the mix.
        // How far they move follows Wander; beds move least, so the floor stays steady.
        function join(stem, n, at, fadeSeconds) {
            const w = restlessness();
            const bed = stem.role === 'bed' || stem.role === 'low';
            const layer = ctx.createGain();
            const lilt = ctx.createGain();
            const tint = ctx.createBiquadFilter();
            tint.type = 'lowpass';
            tint.Q.value = 0.4;
            const drift = ctx.createStereoPanner();
            const trim = ctx.createGain();
            trim.gain.value = Math.pow(10, stem.gain / 20);
            layer.connect(lilt).connect(tint).connect(drift).connect(trim).connect(mix);
            const liltDepth = (bed ? 0.06 : 0.1) + 0.15 * w;
            const motion = {
                lilt: sway(lilt.gain, 1 - liltDepth, liltDepth, at),
                tint: stem.role === 'rhythm' ? null : sway(tint.frequency, bed ? 3200 : 6500, bed ? 1000 + 1200 * w : 2500 + 2500 * w, at),
                drift: sway(drift.pan, (Math.random() - 0.5) * 0.4, (bed ? 0.12 : 0.2) + 0.35 * w, at)
            };
            if (!motion.tint) tint.frequency.value = 20000;
            const fade = fadeSeconds ?? fadeBars(stem.role, true) * clock.barTime;
            const voice = { stem, layer, motion, sources: [], leaving: false, joinedBar: n, restUntil: 0, points: [[at, 0], [at + fade, 1]] };
            layer.gain.setValueAtTime(0, at);
            layer.gain.linearRampToValueAtTime(1, at + fade);
            startSource(voice, n, at, 0);
            voices.push(voice);
            stem.lastHeard = n;
        }

        // Reshape a voice's level from `at` on: straight lines through the given [time, level] points
        function shape(voice, at, points) {
            const from = levelAt(voice, at);
            voice.layer.gain.cancelScheduledValues(at);
            voice.layer.gain.setValueAtTime(from, at);
            points.forEach(([t, v]) => voice.layer.gain.linearRampToValueAtTime(v, t));
            voice.points = [...voice.points.filter(([t]) => t < at), [at, from], ...points];
        }

        function leave(voice, at) {
            const fade = fadeBars(voice.stem.role, false) * clock.barTime;
            voice.leaving = true;
            shape(voice, at, [[at + fade, 0]]);
            voice.endsAt = at + fade + 0.1;
            voice.sources.forEach(s => s.source.stop(voice.endsAt));
            Object.values(voice.motion).forEach(m => m && m.lfo.stop(voice.endsAt));
            voice.stem.lastHeard = nextBar + fadeBars(voice.stem.role, false);
            setTimeout(() => {
                voices = voices.filter(v => v !== voice);
                voice.layer.disconnect();
            }, (at + fade + 0.3 - ctx.currentTime) * 1000);
        }

        function levelAt(voice, t) {
            const points = voice.points;
            if (t <= points[0][0]) return points[0][1];
            for (let i = 1; i < points.length; i++) {
                const [t1, v1] = points[i];
                if (t <= t1) {
                    const [t0, v0] = points[i - 1];
                    return t1 === t0 ? v1 : v0 + (v1 - v0) * (t - t0) / (t1 - t0);
                }
            }
            return points[points.length - 1][1];
        }

        // A stem's loop, started at bar n so it lines up with everything else
        function startSource(voice, n, at, crossfade) {
            const buffer = bufferFor(voice.stem, clock.bpm);
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            source.loop = true;
            const gain = ctx.createGain();
            source.connect(gain).connect(voice.layer);
            const offset = ((n % index.bars) * clock.barTime) % buffer.duration;
            if (crossfade) {
                gain.gain.setValueAtTime(0, at);
                gain.gain.linearRampToValueAtTime(1, at + crossfade);
            }
            source.start(at, offset);
            if (voice.endsAt) source.stop(voice.endsAt);
            voice.sources.push({ source, gain });
        }

        // New tempo: every voice switches to its re-timed loop on the same bar line
        function changeTempo(n, at, bpm) {
            clock = { start: at, bar: n, barTime: loopSeconds(bpm) / index.bars, bpm };
            const swap = 0.06;
            voices.forEach(voice => {
                const old = voice.sources.splice(0);
                old.forEach(({ source, gain }) => {
                    gain.gain.setValueAtTime(1, at);
                    gain.gain.linearRampToValueAtTime(0, at + swap);
                    source.stop(at + swap + 0.05);
                });
                startSource(voice, n, at, swap);
            });
        }

        function onBar(n, at) {
            // Only when every voice (fading ones too) has its re-timed loop, so nothing falls out of step
            if (readyBpm !== null && readyBpm !== clock.bpm && voices.every(v => bufferFor(v.stem, readyBpm))) {
                changeTempo(n, at, readyBpm);
                prepare();
            }
            const phrase = n % PHRASE === 0;
            if (unsettled || phrase) {
                const changed = evaluate(n, at, phrase);
                if (unsettled && !changed) unsettled = false;
            }
        }

        function tick() {
            const ahead = ctx.currentTime + 0.3;
            while (barStart(nextBar) < ahead) {
                onBar(nextBar, barStart(nextBar));
                nextBar++;
            }
        }

        // ---- Play ----

        let wakeLock = null;

        async function togglePlay() {
            if (!stems.length) return;
            if (navigator.audioSession) {
                try { navigator.audioSession.type = 'playback'; } catch (e) {}
            }
            playing = !playing;
            if (playing) {
                await ctx.resume();
                const start = ctx.currentTime + 0.15;
                // Start at the chosen tempo if the likely loops are ready for it, else where they were made
                const ready = bpm => stems.some(s => s.role === 'tune' && bufferFor(s, bpm));
                const bpm = readyBpm !== null && ready(readyBpm) ? readyBpm : index.bpm;
                clock = { start, bar: 0, barTime: loopSeconds(bpm) / index.bars, bpm };
                nextBar = 0;
                voices = [];
                // Open with the hum, a bed if it wants one and one tune; the rest arrive a bar at a time
                const counts = wantedCounts();
                const opening = (counts.bed ? ['bed', 'tune'] : ['tune']).map(role => stems.filter(s => s.role === role && bufferFor(s, bpm))).filter(list => list.length);
                opening.forEach(list => join(pickWeighted(list, s => Math.pow(score(s), 2) + 1e-6), 0, start, 0.01));
                drone.start();
                humLife.timer = setTimeout(liveHum, 6000);
                nextBar = 1;
                unsettled = true;
                master.gain.cancelScheduledValues(ctx.currentTime);
                master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
                master.gain.linearRampToValueAtTime(0.9, start + 2.5);
                ticker = setInterval(tick, 60);
                requestWakeLock();
                renderNow();
            } else {
                const t = ctx.currentTime;
                clearInterval(ticker);
                master.gain.cancelScheduledValues(t);
                master.gain.setValueAtTime(master.gain.value, t);
                master.gain.linearRampToValueAtTime(0, t + 1.2);
                drone.stop();
                clearTimeout(humLife.timer);
                const stopping = voices;
                voices = [];
                setTimeout(() => {
                    stopping.forEach(v => {
                        v.sources.forEach(s => { try { s.source.stop(); } catch (e) {} });
                        Object.values(v.motion).forEach(m => { try { m && m.lfo.stop(); } catch (e) {} });
                    });
                    if (!playing) ctx.suspend();
                }, 1400);
                releaseWakeLock();
                renderNow();
            }
            renderPlayer();
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (e) {}
        }

        function releaseWakeLock() {
            if (wakeLock) wakeLock.release();
            wakeLock = null;
        }

        document.addEventListener('visibilitychange', () => {
            if (playing && document.visibilityState === 'visible') requestWakeLock();
        });

        // ---- Controls ----

        function setSetting(name, value) {
            settings[name] = value;
            saveSettings();
            unsettled = true;
            if (name === 'gait') requestTempo();
            if (name === 'hour') applyShade(false);
            if (name !== 'gait') prepare();
            tuneDrone();
            renderNow();
        }

        // ---- Picture ----
        // Each layer is a soft blot of color: the bed pools in the middle, tunes drift around it,
        // and the rhythm sits further out and swells on the beat. Dusk tints it blue, dawn gold.

        const PALETTE = ['#a0522d', '#b07d2a', '#3e5f8a', '#7b4b6a', '#2f6f6b', '#6b7a3a', '#94404f', '#586878', '#34466e'];

        function hash(text) {
            let h = 0;
            for (const c of text) h = (h * 31 + c.charCodeAt(0)) >>> 0;
            return h;
        }

        function colorFor(instrument) {
            return PALETTE[hash(instrument) % PALETTE.length];
        }

        function mixColor(a, b, t) {
            const pa = a.match(/\w\w/g).map(x => parseInt(x, 16));
            const pb = b.match(/\w\w/g).map(x => parseInt(x, 16));
            return `rgb(${pa.map((v, i) => Math.round(v + (pb[i] - v) * t)).join(',')})`;
        }

        const canvas = document.getElementById('canvas');
        const rings = {};
        const paint = canvas.getContext('2d');

        function draw() {
            const size = canvas.clientWidth;
            const scale = window.devicePixelRatio || 1;
            if (canvas.width !== Math.round(size * scale)) {
                canvas.width = canvas.height = Math.round(size * scale);
            }
            const R = canvas.width / 2;
            const now = ctx ? ctx.currentTime : 0;
            const wall = performance.now() / 1000;

            paint.globalCompositeOperation = 'source-over';
            const sky = paint.createRadialGradient(R, R, 0, R, R, R);
            sky.addColorStop(0, '#fffdf7');
            sky.addColorStop(1, mixColor('#d3d8ea', '#f3e2bd', settings.hour));
            paint.fillStyle = sky;
            paint.fillRect(0, 0, canvas.width, canvas.height);

            paint.globalCompositeOperation = 'multiply';
            // The hum: soft rings, one per voice, breathing slowly from the middle
            HUM_ORDER.forEach((id, i) => {
                const target = playing && drone && humVoices().includes(id) && !humLife.resting.has(id) ? (humLife.swell[id] ?? 1) : 0;
                rings[id] = (rings[id] ?? 0) + (target - (rings[id] ?? 0)) * 0.012;
            });
            HUM_ORDER.forEach((id, i) => {
                if (rings[id] < 0.01) return;
                const r = R * (0.2 + 0.13 * i + 0.02 * Math.sin(wall * 0.5 + i * 1.3));
                paint.strokeStyle = `rgba(176, 125, 42, ${0.16 * rings[id]})`;
                paint.lineWidth = R * 0.05;
                paint.beginPath();
                paint.arc(R, R, r, 0, Math.PI * 2);
                paint.stroke();
            });
            const beatTime = clock ? clock.barTime / index.beatsPerBar : 1;
            const beat = clock && playing ? ((now - clock.start) / beatTime % 1 + 1) % 1 : 0.5;
            const shown = playing ? voices : [];
            shown.forEach(voice => {
                const level = levelAt(voice, now) * valueOf(voice.motion.lilt, now);
                if (level <= 0.001) return;
                const stem = voice.stem;
                let x = R + valueOf(voice.motion.drift, now) * R * 0.35;
                let y = R;
                let radius;
                if (stem.role === 'bed') {
                    radius = R * (0.62 + 0.04 * Math.sin(wall * 0.3));
                } else if (stem.role === 'low') {
                    y = R * (1.5 + 0.04 * Math.sin(wall * 0.25));
                    radius = R * 0.55;
                } else if (stem.role === 'rhythm') {
                    const a = stem.angle + wall * 0.05;
                    x += Math.cos(a) * R * 0.5;
                    y += Math.sin(a) * R * 0.5;
                    radius = R * (0.2 + 0.07 * Math.exp(-beat * 5));
                } else {
                    const a = stem.angle + wall * (0.07 + stem.energyAt * 0.08);
                    const orbit = R * (0.28 + 0.12 * Math.sin(wall * 0.11 + stem.angle));
                    x += Math.cos(a) * orbit;
                    y += Math.sin(a) * orbit;
                    radius = R * (0.3 + 0.05 * Math.sin(wall * 0.4 + stem.angle * 3));
                }
                const blot = paint.createRadialGradient(x, y, 0, x, y, radius);
                const alpha = Math.round(Math.min(1, level) * (stem.role === 'bed' || stem.role === 'low' ? 120 : 215)).toString(16).padStart(2, '0');
                blot.addColorStop(0, stem.color + alpha);
                blot.addColorStop(1, stem.color + '00');
                paint.fillStyle = blot;
                paint.beginPath();
                paint.arc(x, y, radius, 0, Math.PI * 2);
                paint.fill();
            });
            requestAnimationFrame(draw);
        }

        // ---- Display ----

        function setText(id, text) {
            document.getElementById(id).textContent = text;
        }

        const PLAY_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6a.8.8 0 0 0 1.2.7l10.6-6.8a.8.8 0 0 0 0-1.4L9.2 4.5A.8.8 0 0 0 8 5.2z"/></svg>';
        const PAUSE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1"/><rect x="13.8" y="5" width="4.2" height="14" rx="1"/></svg>';

        function renderPlayer() {
            document.getElementById('player').classList.toggle('playing', playing);
            document.getElementById('playBtn').innerHTML = playing ? PAUSE_ICON : PLAY_ICON;
            document.getElementById('playBtn').setAttribute('aria-label', playing ? 'Pause' : 'Play');
            if (stems.length) setText('playLabel', playing ? 'tap to pause' : 'tap to play');
        }

        // What's playing, quietly: bed first, then the rest
        function renderNow() {
            const order = { bed: 0, low: 1, rhythm: 2, tune: 3 };
            const names = playing ? voices.filter(v => !v.leaving).sort((a, b) => order[a.stem.role] - order[b.stem.role]).map(v => v.stem.instrument) : [];
            if (playing && drone && drone.voiceCount()) names.unshift('hum');
            setText('now', names.join(' · '));
        }

        function render() {
            ['kindling', 'hour', 'gait', 'hum'].forEach(name => {
                document.getElementById(name).value = Math.round((settings[name] ?? 0.5) * 1000);
            });
        }

        // Skipped on localhost so local edits show up right away
        if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
            navigator.serviceWorker.register('sw.js');
        }

        render();
        renderPlayer();
        requestAnimationFrame(draw);
        loadAll().catch(err => {
            console.error(err);
            setText('playLabel', "couldn't gather the loops");
        });
    </script>
</body>
